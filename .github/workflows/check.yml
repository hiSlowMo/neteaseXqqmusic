name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:core
      - run: npm run build
      - name: Check committed bundle matches source
        run: git diff --exit-code -- dist/index.js
      - run: npm run pack
      - name: Verify release archive
        run: unzip -t releases/mygo-music-fusion-*.zip
